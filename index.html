<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1b1128"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>OYO Command Center</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#241c2c;background:#f5f3f8}*{box-sizing:border-box}body{margin:0}header{background:#1b1128;color:white;padding:20px max(18px,calc((100vw - 1250px)/2));}header h1{margin:0;font-size:24px}header small{color:#d7b16a;letter-spacing:2px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}button,.button{border:1px solid #d6cfe0;background:white;color:#352346;border-radius:9px;padding:10px 13px;cursor:pointer;font:inherit;font-size:13px}button:hover{filter:brightness(.95)}button.active,.primary{background:#7135a9;color:white;border-color:#7135a9}button.gold{background:#c59c51;color:#241525;border-color:#c59c51}main{max-width:1250px;margin:auto;padding:22px 16px 60px}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.muted{color:#71677b;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px}.card{background:white;border:1px solid #e5dfeb;border-radius:14px;padding:17px;margin:10px 0;box-shadow:0 2px 8px #21102e08}.stat{font-size:27px;font-weight:750;color:#482069}.goldtext{color:#96712d}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:15px 0}.tabs button{padding:8px 10px}input,select,textarea{width:100%;padding:10px;border:1px solid #d5cede;border-radius:8px;font:inherit;background:white;color:#261d2d}textarea{min-height:80px;resize:vertical}label{font-size:12px;color:#655a6d;display:block;margin:8px 0 4px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.field{min-width:0}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #ece7f0;text-align:left;padding:10px 7px;vertical-align:top}th{color:#6c6075}table button{padding:5px 8px}.scroll{overflow-x:auto}.pill{display:inline-block;border-radius:20px;background:#eee7f5;padding:4px 9px;font-size:11px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.split{display:grid;grid-template-columns:1fr 1fr;gap:15px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.day{min-height:75px;border:1px solid #e5ddea;border-radius:8px;padding:6px;background:white;cursor:pointer;overflow:hidden}.day.selected{outline:2px solid #7135a9}.day strong{font-size:12px}.dot{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot.lwa{color:#7135a9}.dot.oyo{color:#a57a2d}.dot.personal{color:#667180}.empty{background:#f2eef4}.notice{background:#f2ecfa;border-radius:10px;padding:12px;font-size:13px}.progress{height:6px;background:#eee8f3;border-radius:8px;overflow:hidden}.progress>div{height:100%;background:#7135a9}.progress.goldbar>div{background:#c59c51}.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.inline input[type=checkbox]{width:auto}.danger{color:#a12443}.hidden{display:none}.workspace{border-left:5px solid #7135a9}.workspace.oyo{border-color:#c59c51}.workspace.personal{border-color:#8b919d}@media(max-width:680px){.split{grid-template-columns:1fr}.day{min-height:58px;padding:3px}.dot{font-size:8px}header h1{font-size:20px}th,td{font-size:12px}}
</style></head><body><header><small>OWN YOUR OPTIONS TECHNOLOGIES</small><h1>OYO Command Center</h1><nav id="nav"></nav></header><main id="app"></main><script src="app.js"></script></body></html>
